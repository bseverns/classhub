<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ClassHub board flow</title>
  <desc id="desc">Students join, learn, make artifacts, and create teacher evidence, with trust controls and operator ownership surrounding the flow.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; ry: 18; }
      .accent { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 18; ry: 18; }
      .ops { fill: #ecfccb; stroke: #4d7c0f; stroke-width: 2; rx: 18; ry: 18; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .label { font: 700 25px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 19px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .caption { font: 600 20px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="420"/>
  <rect class="box" x="70" y="120" width="190" height="90"/>
  <text class="label" x="165" y="155">Students join</text>
  <text class="small" x="165" y="185">class code or invite</text>
  <rect class="box" x="320" y="120" width="190" height="90"/>
  <text class="label" x="415" y="155">Lessons + helper</text>
  <text class="small" x="415" y="185">day-of-class flow</text>
  <rect class="box" x="570" y="120" width="190" height="90"/>
  <text class="label" x="665" y="155">Artifacts</text>
  <text class="small" x="665" y="185">submissions, portfolio, gallery</text>
  <rect class="box" x="820" y="120" width="220" height="90"/>
  <text class="label" x="930" y="155">Teacher evidence</text>
  <text class="small" x="930" y="185">exports, certificates, closeout</text>
  <path class="line" d="M260 165 H320"/>
  <path class="line" d="M510 165 H570"/>
  <path class="line" d="M760 165 H820"/>
  <rect class="accent" x="170" y="275" width="680" height="92"/>
  <text class="label" x="510" y="312">Trust controls</text>
  <text class="small" x="510" y="342">retention, deletion, plain-language data pages</text>
  <path class="dash" d="M240 275 C230 245, 210 225, 190 210"/>
  <path class="dash" d="M410 275 C410 240, 412 225, 415 210"/>
  <path class="dash" d="M600 275 C620 245, 645 225, 665 210"/>
  <path class="dash" d="M780 275 C840 240, 895 220, 930 210"/>
  <rect class="ops" x="895" y="275" width="240" height="92"/>
  <text class="label" x="1015" y="312">Operator ownership</text>
  <text class="small" x="1015" y="342">deployment, backup, recovery</text>
  <path class="dash" d="M965 275 C955 248, 945 230, 935 210"/>
  <text class="caption" x="70" y="55">ClassHub board view: join, teach, make, report, with trust and operations built in</text>
</svg>
