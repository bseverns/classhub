<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">ClassHub board thesis</title>
  <desc id="desc">ClassHub turns fragile program memory into shared program infrastructure, leading to repeatable programs, clearer handoffs, reporting, and governance.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 18; ry: 18; }
      .accent { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 18; ry: 18; }
      .ops { fill: #ecfccb; stroke: #4d7c0f; stroke-width: 2; rx: 18; ry: 18; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .label { font: 700 25px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 19px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .caption { font: 600 20px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="430"/>
  <rect class="box" x="55" y="125" width="330" height="120"/>
  <text class="label" x="220" y="162">Fragile program memory</text>
  <text class="small" x="220" y="192">staff know-how, folders,</text>
  <text class="small" x="220" y="217">ad hoc spreadsheets, reporting drift,</text>
  <text class="small" x="220" y="242">handoff risk</text>
  <rect class="accent" x="470" y="125" width="300" height="120"/>
  <text class="label" x="620" y="167">ClassHub</text>
  <text class="small" x="620" y="202">shared program infrastructure</text>
  <rect class="box" x="855" y="125" width="370" height="120"/>
  <text class="label" x="1040" y="162">Repeatable programs</text>
  <text class="small" x="1040" y="192">clear handoffs, exports, governance,</text>
  <text class="small" x="1040" y="217">curriculum portability, continuity</text>
  <path class="line" d="M385 185 H470"/>
  <path class="line" d="M770 185 H855"/>
  <rect class="accent" x="420" y="300" width="390" height="86"/>
  <text class="label" x="615" y="332">Trust boundaries</text>
  <text class="small" x="615" y="358">minimal identity, retention, data controls</text>
  <path class="dash" d="M615 300 V245"/>
  <rect class="ops" x="910" y="300" width="290" height="86"/>
  <text class="label" x="1055" y="332">Operator ownership</text>
  <text class="small" x="1055" y="358">deployment, backup, recovery</text>
  <path class="dash" d="M1040 300 V245"/>
  <text class="caption" x="55" y="58">ClassHub board view: turning fragile program memory into shared infrastructure</text>
</svg>
