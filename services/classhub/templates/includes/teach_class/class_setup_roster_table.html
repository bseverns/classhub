{% if students %}
  <div class="roster-table-wrap">
    <table>
      <caption class="visually-hidden">Student roster for {{ classroom.name }}</caption>
      <thead>
        <tr>
          <th scope="col">Student</th>
          <th scope="col">Return code</th>
          <th scope="col">Submissions</th>
          <th scope="col">Support tags</th>
          <th scope="col"><span class="visually-hidden">Actions</span></th>
        </tr>
      </thead>
      <tbody>
        {% for st in students %}
          {% include "includes/teach_class/class_setup_roster_student_row.html" %}
        {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <p class="muted section-empty-note">No students in roster yet.</p>
{% endif %}
