name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/lint.yml
      - name: Install ruff
        run: pip install ruff==0.8.6
      - name: Ruff blocking gate (syntax/undefined)
        run: ruff check services scripts --select E9,F63,F7,F82
      - name: Ruff advisory coverage (E,F,I,B,UP)
        run: ruff check services scripts --select E,F,I,B,UP --statistics --exit-zero | tee /tmp/ruff-advisory.txt
      - name: Lint summary
        if: always()
        run: |
          {
            echo "### Ruff advisory stats"
            echo '```text'
            if [[ -f /tmp/ruff-advisory.txt ]]; then
              cat /tmp/ruff-advisory.txt
            else
              echo "ruff advisory output unavailable (prior step did not complete)."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Repo hygiene guard
        run: bash scripts/repo_hygiene_check.sh
      - name: Guard internal service port exposure
        run: python scripts/check_compose_port_exposure.py
      - name: Guard against :latest image tags
        run: python scripts/check_no_latest_tags.py
      - name: Guard classhub frontend static references
        run: python scripts/check_frontend_static_refs.py
      - name: Guard templates against inline JS surfaces
        run: python scripts/check_no_inline_template_js.py
      - name: Guard templates against inline CSS surfaces
        run: python scripts/check_no_inline_template_css.py
      - name: Guard view modules to use shared security header helpers
        run: python scripts/check_view_header_helpers.py
      - name: Guard endpoint-level RBAC capability checks
        run: python scripts/check_rbac_endpoint_guards.py
      - name: Guard teacher endpoint capability route map
        run: python scripts/check_teacher_endpoint_capability_map.py
      - name: Guard advanced policy/RBAC mode access contract
        run: python scripts/check_teacher_policy_mode_contract.py
      - name: Guard dense view module size budgets
        run: python scripts/check_view_size_budgets.py
      - name: Guard dense view function size budgets
        run: python scripts/check_view_function_budgets.py
      - name: Guard service-layer imports from view modules
        run: python scripts/check_no_service_imports_from_views.py
      - name: Guard dynamic __all__ exports in service modules
        run: python scripts/check_no_dynamic_service_all_exports.py
      - name: Guard new wildcard imports in ClassHub view modules
        run: python scripts/check_no_new_wildcard_view_imports.py
      - name: Guard critical CI workflow coverage
        run: python scripts/check_ci_workflow_coverage.py
      - name: Guard subsystem test inventory coverage
        run: python scripts/check_test_inventory_coverage.py
