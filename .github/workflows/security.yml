name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

env:
  TRIVY_VERSION: v0.67.0

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/classhub/requirements.txt
            services/homework_helper/requirements.txt
            .github/workflows/security.yml
      - name: Install dependency auditor
        run: pip install pip-audit==2.8.0
      - name: Audit classhub dependencies
        run: pip-audit -r services/classhub/requirements.txt --progress-spinner off
      - name: Audit helper dependencies
        run: pip-audit -r services/homework_helper/requirements.txt --progress-spinner off

  sast-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/security.yml
      - name: Install Bandit
        run: pip install bandit==1.8.3
      - name: Bandit scan + gate
        run: bash scripts/run_bandit.sh all bandit-report.json
      - name: Upload Bandit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: classhub
            image_tag: classhub-web:ci
          - service: homework_helper
            image_tag: homework-helper-web:ci
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sfL --retry 3 --retry-all-errors \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          install /tmp/trivy "$HOME/.local/bin/trivy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          trivy --version
      - name: Build ${{ matrix.service }} image for scan
        run: |
          docker build \
            --build-arg APP_UID=10001 \
            --build-arg APP_GID=10001 \
            --tag "${{ matrix.image_tag }}" \
            --file "services/${{ matrix.service }}/Dockerfile" \
            services
      - name: Trivy image scan (${{ matrix.service }})
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ matrix.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
